<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Kermés · 5° básico</title>
  <style>body{font:18px/1.6 system-ui,sans-serif;margin:0;background:#f3f6fb;color:#53627a}main{max-width:480px;margin:12vh auto;padding:32px}</style>
</head>
<body>
  <main>
    <p id="status">La organización está preparando las inscripciones.</p>
    <noscript><p>Activa JavaScript para abrir el enlace de inscripción.</p></noscript>
  </main>
  <script src="config.js"></script>
  <script>
    const url = window.KERMES_APP_URL;
    if (typeof url === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url)) {
      location.replace(url);
    }
  </script>
</body>
</html>
