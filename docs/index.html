<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Kermés · 5° básico</title>
  <style>
    html,body{margin:0;height:100%;background:#f3f6fb;color:#53627a;font:18px/1.6 system-ui,sans-serif}
    main{max-width:480px;margin:12vh auto;padding:32px}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f6fb}
  </style>
</head>
<body>
  <main id="fallback">
    <p id="status">La organización está preparando las inscripciones.</p>
    <noscript><p>Activa JavaScript para abrir el enlace de inscripción.</p></noscript>
  </main>
  <script src="config.js"></script>
  <script>
    const url = window.KERMES_APP_URL;
    if (typeof url === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url)) {
      const frame = document.createElement('iframe');
      frame.src = url;
      frame.title = 'Kermés 2026 · 5° básico';
      frame.setAttribute('allow', 'clipboard-write');
      document.getElementById('fallback').hidden = true;
      document.body.append(frame);
    }
  </script>
</body>
</html>
